---
name: Auto Labeler

"on":
  # pull_request_target event is required for autolabeler to support all PRs
  # including forks
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  main:
    name: Auto label pull requests

    runs-on: ubuntu-latest

    steps:
      # yamllint disable-line rule:line-length rule:comments
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yaml
